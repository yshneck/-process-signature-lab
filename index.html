<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#111827"/>
<link rel="manifest" href="manifest.webmanifest"/>
<title>Process Signature Lab v0.1</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111827;background:#f3f4f6}
body{margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}
h1{font-size:24px;margin:0 0 6px}h2{font-size:18px}.muted{color:#6b7280;font-size:14px}
button,.filelabel,select,input{font:inherit}.filelabel,button{display:inline-block;border:0;border-radius:12px;padding:12px 16px;background:#111827;color:white;margin:4px;cursor:pointer}
button.secondary{background:#e5e7eb;color:#111827}input[type=file]{display:none}
img{max-width:100%;max-height:420px;border-radius:12px;display:block;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.metric{background:#f9fafb;padding:10px;border-radius:12px}
.metric b{display:block;font-size:12px;color:#6b7280}.metric span{font-variant-numeric:tabular-nums}
progress{width:100%;height:16px}.ltr{direction:ltr;text-align:left}details{margin-top:10px}
.warn{background:#fffbeb;border:1px solid #fde68a}.ok{background:#ecfdf5;border:1px solid #a7f3d0}
</style>
</head>
<body><div class="wrap">
<div class="card">
<h1>Process Signature Lab <small>v0.1</small></h1>
<div class="muted">מעבדת מחקר מקומית לתמונות. אין העלאה לשרת ואין כרגע קביעה "AI/אנושי".</div>
</div>
<div class="card">
<label class="filelabel">בחר תמונה מהאייפון<input id="file" type="file" accept="image/*"></label>
<button class="secondary" id="run" disabled>הרץ ניתוח</button>
<button class="secondary" id="export" disabled>ייצא תוצאה JSON</button>
<p id="status" class="muted">ממתין לתמונה.</p>
<progress id="prog" value="0" max="100" hidden></progress>
<img id="preview" hidden/>
</div>
<div class="card warn">
<b>מצב מחקר</b>
<div class="muted">הגרסה מודדת micro-signals ותלויות ביניהם. היא אינה משתמשת ב-EXIF, בשם הקובץ או במודל AI. התוצאה אינה הוכחת אותנטיות.</div>
</div>
<div class="card" id="summary" hidden>
<h2>סיכום הריצה</h2><div class="grid" id="summaryGrid"></div>
</div>
<div class="card" id="results" hidden>
<h2>Feature Registry — מדידות בפועל</h2><div class="grid" id="metrics"></div>
<details><summary>פלט מלא</summary><pre id="raw" class="ltr"></pre></details>
</div>
</div>
<script src="app.js"></script>
</body></html>
